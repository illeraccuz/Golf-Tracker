<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d2b"><title>Golf Execution</title><style>body{margin:0;background:#f4f5f2;color:#18201b;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:720px;margin:auto;padding-bottom:80px}header{background:#173d2b;color:#fff;padding:24px 18px}main{padding:16px}.card{background:#fff;border:1px solid #dce2dc;border-radius:16px;padding:16px;margin-bottom:14px}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:700}.primary{background:#173d2b;color:white}.secondary{background:#e9eee9;color:#173d2b}.field{width:100%;padding:12px;border:1px solid #dce2dc;border-radius:10px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.score{font-size:34px;font-weight:800}.scoreBtns{display:flex;gap:6px;flex-wrap:wrap}.scoreBtns button{width:42px;height:42px;border:0;border-radius:9px}.active{background:#173d2b!important;color:#fff}.exec{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #dce2dc}.sym{width:42px;height:42px;border:0;border-radius:50%;font-size:21px;font-weight:800}.ok{color:#173d2b}.bad{color:#a33b35}.na{color:#777}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce2dc;display:flex;justify-content:center}.nav button{background:none;padding:14px 22px;color:#68736c}.nav .sel{color:#173d2b;font-weight:800}.actions{display:flex;gap:8px}.actions button{flex:1}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:end}.sheet{background:white;width:100%;max-width:720px;margin:auto;padding:18px;border-radius:20px 20px 0 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.choices button{padding:15px;border:1px solid #dce2dc;border-radius:10px;background:#fafbfa;font-weight:700}.empty{padding:25px;text-align:center;color:#68736c}</style></head><body><div class="app"><header><b>Golf Execution</b><div id="sub">Scorecard + shot execution</div></header><main id="main"></main><nav class="nav"><button onclick="view='home';render()" id="nHome">Round</button><button onclick="view='history';render()" id="nHistory">History</button><button onclick="view='stats';render()" id="nStats">Stats</button></nav></div><script>
const K='golfExecutionV1';let rounds=JSON.parse(localStorage.getItem(K)||'[]'),view='home',round=null,hole=1,editing=null;const save=()=>localStorage.setItem(K,JSON.stringify(rounds));const h=()=>round.holes[hole-1];const uid=()=>Date.now()+Math.random();
function render(){nHome.className=view==='home'?'sel':'';nHistory.className=view==='history'?'sel':'';nStats.className=view==='stats'?'sel':'';view==='home'?home():view==='history'?history():view==='stats'?stats():play()}
function home(){sub.textContent='Scorecard + shot execution';main.innerHTML=`<div class=card><h2>Start a Round</h2><label>Course</label><input id=course class=field placeholder="Course name"><label>Tee</label><input id=tee class=field placeholder="Tee box"><div class=grid><div><label>Date</label><input id=date class=field type=date value="${new Date().toISOString().slice(0,10)}"></div><div><label>Holes</label><select id=holes class=field><option>18</option><option>9</option></select></div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick=start()>Start Round</button></div>`}
function start(){let n=+holes.value;round={id:uid(),course:course.value||'Untitled Round',tee:tee.value,date:date.value,holes:Array.from({length:n},(_,i)=>({number:i+1,par:4,score:null,shots:[]}))};rounds.unshift(round);save();hole=1;view='play';render()}
function play(){let x=h();sub.textContent=round.course;let rel=x.score==null?'':x.score-x.par===0?'E':x.score-x.par>0?'+'+(x.score-x.par):x.score-x.par;main.innerHTML=`<div class=card><div style="display:flex;justify-content:space-between"><div><div>Hole ${x.number}</div><div class=score>${x.par}</div><small>Par</small></div><div style="text-align:right"><div>Score</div><div class=score>${x.score??'—'}</div><small>${rel}</small></div></div><label>Scorecard</label><div class=scoreBtns>${[1,2,3,4,5,6,7,8].map(n=>`<button class="${x.score===n?'active':''}" onclick="setScore(${n})">${n}</button>`).join('')}</div><label>Par</label><select class=field onchange="setPar(this.value)">${[3,4,5].map(n=>`<option ${x.par===n?'selected':''}>${n}</option>`).join('')}</select></div><div class=card><h3>Execution</h3>${x.shots.length?x.shots.map(s=>`<div class=exec><span><b>${s.type==='Putt'?'Putt ('+s.intent+')':s.type}</b>${s.quality?` <small>${s.quality}</small>`:''}</span><span><button class="sym ${s.result}" onclick="cycle('${s.id}')">${s.result==='ok'?'✓':s.result==='bad'?'X':'—'}</button><button class="btn secondary" onclick="edit('${s.id}')">Edit</button></span></div>`).join(''):`<div class=empty>No execution shots yet.</div>`}<button class="btn primary" style="width:100%;margin-top:12px" onclick="add()">+ Add Shot</button></div><div class=actions><button class="btn secondary" onclick="prev()">← Previous</button><button class="btn primary" onclick="next()">${hole===round.holes.length?'Finish':'Next →'}</button></div>`}
function setScore(n){h().score=n;save();play()}function setPar(n){h().par=+n;save();play()}function prev(){if(hole>1){hole--;render()}}function next(){if(hole<round.holes.length){hole++;render()}else{view='history';render()}}
function add(){editing={id:uid(),type:'Tee',result:'ok',quality:'',intent:'Lag'};modal()}function edit(id){editing=h().shots.find(s=>s.id===id);modal()}function modal(){let s=editing;document.body.insertAdjacentHTML('beforeend',`<div class=modal id=modal><div class=sheet><h2>${s.id?'Shot':'Add Shot'}</h2><label>Type</label><div class=choices>${['Tee','Approach','Chip','Putt'].map(t=>`<button onclick="editing.type='${t}';modalReplace()">${t}</button>`).join('')}</div>${s.type==='Putt'?`<label>Putt intent</label><div class=choices><button onclick="editing.intent='Lag';modalReplace()">Lag</button><button onclick="editing.intent='Make';modalReplace()">Make</button></div>`:''}<label>Execution</label><div class=choices><button onclick="editing.result='ok';modalReplace()">✓</button><button onclick="editing.result='bad';modalReplace()">X</button><button onclick="editing.result='na';modalReplace()">—</button></div><label>Quality</label><div class=choices><button onclick="editing.quality='Excellent';modalReplace()">Excellent</button><button onclick="editing.quality='Ugly';modalReplace()">Ugly</button><button onclick="editing.quality='';modalReplace()">None</button></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveShot()">Save Shot</button></div></div>`)}function modalReplace(){document.getElementById('modal')?.remove();modal()}function saveShot(){let a=h().shots,i=a.findIndex(x=>x.id===editing.id);if(i>=0)a[i]=editing;else a.push(editing);save();document.getElementById('modal').remove();play()}function cycle(id){let s=h().shots.find(x=>x.id===id);s.result=s.result==='ok'?'bad':s.result==='bad'?'na':'ok';save();play()}
function history(){sub.textContent='Past rounds';main.innerHTML=`<div class=card><h2>Round History</h2>${rounds.length?rounds.map(r=>`<div class=exec><span><b>${r.course}</b><br><small>${r.date}</small></span><b>${r.holes.reduce((a,x)=>a+(x.score||0),0)}</b></div>`).join(''):'<div class=empty>No rounds yet.</div>'}</div>`}
function stats(){sub.textContent='Performance';let all=rounds.flatMap(r=>r.holes.flatMap(x=>x.shots)),cats={Tee:0,Approach:0,Chip:0,Lag:0,Make:0};let good={...cats};all.forEach(s=>{let k=s.type==='Putt'?s.intent:s.type;if(k in cats&&s.result!=='na'){cats[k]++;if(s.result==='ok')good[k]++}});main.innerHTML=`<div class=card><h2>Stats</h2>${Object.keys(cats).map(k=>`<div class=exec><span>${k}</span><b>${cats[k]?Math.round(good[k]/cats[k]*100)+'% ('+good[k]+'/'+cats[k]+')':'—'}</b></div>`).join('')}</div>`}
render();</script></body></html>
